
name: Sync BTC Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Download paper trading results
        env:
          GH_TOKEN: ${{ secrets.BTC_DASHBOARD_READ_ONLY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/afmerced4-creator/trading-bot/contents/experimental_paper_state.json" \
            -o paper_state.json

          python -m json.tool paper_state.json > /dev/null

      - name: Save latest dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync latest paper trading results"
            git push
          fi
